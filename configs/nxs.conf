[main]
ENABLED = 1
DATA_DIR = /var/lib/nxs
LOG_DIR = /var/log/nxs
RUN_DIR = /var/run/nxs

[findings]
LOG_PATH = /var/log/nxs/findings.log
STATE_PATH = /var/lib/nxs/state/findings.json
NOTIFY = 1
NOTIFY_MIN_SEVERITY = high
NOTIFY_COOLDOWN = 30m

[samples]
MAX_DIFF_LINES = 20
MAX_LINE_LENGTH = 300
MAX_SAMPLES_PER_FINDING = 10
REDACT_SECRETS = 1
URL_DEFANG = 1

[engine]
ENABLED = 1
SIG_DIR = /var/lib/nxs/signatures
HASH_DB = /usr/share/nxs/hashdb.csv
YARA_ENABLED = 1
MAX_FILE_SIZE = 10485760

[scanner]
ENABLED = 1
FANOTIFY_ENABLED = 1
WATCH_PATHS = /home,/tmp,/dev/shm,/root
PERIODIC_ENABLED = 1
PERIODIC_EVERY = 6h
PERIODIC_START_HOUR = 2
# Empty = scan all extensions (recommended; executable-bit detection still applies)
WATCH_EXTENSIONS =
MAX_FILE_SIZE = 2097152
QUARANTINE_DIR = /var/lib/nxs/quarantine
AUTO_CLEAN = 1
QUEUE_SIZE = 1024
MAX_WORKERS = 4

[quarantine]
DIR = /var/lib/nxs/quarantine
MODE = chmod

[notify]
ENABLED = 1
METHOD = sendmail
SENDMAIL_PATH = /usr/sbin/sendmail
TO = root@localhost
FROM = nxs@localhost
DEFAULT_COOLDOWN = 30m
MIN_SEVERITY = high

[exclusions]
FILE = /var/lib/nxs/state/exclusions.json

[maintenance]
STATE_PATH = /var/lib/nxs/state/maintenance.json

[signatures]
